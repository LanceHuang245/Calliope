[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
# The mobile and Apple targets `nsh run` / `nsh package` build for. The
# desktop target of the machine is always there.
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]
