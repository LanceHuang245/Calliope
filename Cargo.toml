[workspace]
resolver = "3"
members = ["app", "crates/*"]
# `nsh` writes a Cargo workspace of its own into `app/.nsh/rust` (the app's
# runners, `describe` and the headless test runner).
exclude = ["app/.nsh"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Calliope's own crates.
calliope-core = { path = "crates/calliope-core" }
calliope-sync = { path = "crates/calliope-sync" }

# Native Shell (https://nsh.dev), the nightly build of `main`: every nsh
# crate comes from Git at the commit of the nightly CLI CI installs
# (`NSH_VERSION: nightly`, see its `nsh --version`). Move `rev` with the
# nightly: the `nsh` CLI builds the app's runners from this checkout.
# `nsh-base`: `highlight` colors code blocks, `math` typesets formulas.
# `svg`: the icons (`app/src/components/icons.rs`).
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "c5214aaf4bbdf33bc1d59e9595e009b6aa54d702", features = ["svg"] }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "c5214aaf4bbdf33bc1d59e9595e009b6aa54d702", features = ["highlight", "math"] }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "c5214aaf4bbdf33bc1d59e9595e009b6aa54d702", default-features = false }
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "c5214aaf4bbdf33bc1d59e9595e009b6aa54d702" }
# The desktop backends `cargo run` uses (`app/src/main.rs`). Without `js`, a
# Rust app links no QuickJS.
nsh-platform-linux = { git = "https://github.com/longbridge/nsh", rev = "c5214aaf4bbdf33bc1d59e9595e009b6aa54d702", default-features = false }
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "c5214aaf4bbdf33bc1d59e9595e009b6aa54d702", default-features = false }
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", rev = "c5214aaf4bbdf33bc1d59e9595e009b6aa54d702", default-features = false }

# Mermaid diagrams (`app/src/pages/mermaid.rs`): only the diagrams Calliope
# shows, as SVG laid out with the system's fonts; no ELK layout (EPL-2.0).
# `usvg` (the version `merman-export` uses) turns the labels into paths.
merman = { version = "0.9.3", default-features = false, features = [
    "svg",
    "system-fonts",
    "diagram-flowchart",
    "diagram-sequence",
    "diagram-class",
    "diagram-state",
    "diagram-gantt",
    "diagram-pie",
] }
merman-export = { version = "0.9.3", features = ["system-fonts"] }
usvg = { version = "0.47", default-features = false, features = ["text"] }

# Shared third-party crates.
log = "0.4"
notify = "8"
thiserror = "2"
url = "2"
