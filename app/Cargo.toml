[package]
name = "calliope"
description = "Calliope: a Markdown knowledge base with built-in WebDAV and S3 sync, on Native Shell."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
calliope-core.workspace = true
log.workspace = true
merman.workspace = true
merman-export.workspace = true
nsh-base.workspace = true
nsh-core.workspace = true
usvg.workspace = true

# `cargo run` (src/main.rs) on this machine's desktop backend. `nsh run` and
# `nsh package` build runners of their own for every target.
[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows.workspace = true

[dev-dependencies]
nsh-engine.workspace = true
nsh-testing.workspace = true
