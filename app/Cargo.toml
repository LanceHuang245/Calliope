[package]
name = "calliope"
description = "Calliope: a Markdown knowledge base with built-in WebDAV and S3 sync, on Native Shell."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
calliope-core.workspace = true
calliope-sync.workspace = true
jiff.workspace = true
keyring-core.workspace = true
log.workspace = true
merman.workspace = true
merman-export.workspace = true
nsh-base.workspace = true
nsh-core.workspace = true
serde_json.workspace = true
usvg.workspace = true

# `cargo run` (src/main.rs) on this machine's desktop backend. `nsh run` and
# `nsh package` build runners of their own for every target. Each system's
# secure storage keeps the sync passwords (src/secrets.rs).
[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true
zbus-secret-service-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true
apple-native-keyring-store = { workspace = true, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows.workspace = true
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["protected"] }
block2 = "0.6.2"
nsh-platform-ios.workspace = true
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "objc2-core-foundation", "objc2-quartz-core", "UIAction",
    "UIButton", "UIButtonConfiguration", "UIColor", "UIControl", "UIGeometry",
    "UIImage", "UIInterface", "UIMenuElement",
    "UIResponder", "UIView",
    "UIVisualEffect", "UIVisualEffectView",
] }

# merman finds no fonts on the phones: there, Mermaid labels use the font it
# bundles (Cousine, OFL), which has no Chinese, Japanese or Korean.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
merman-export = { workspace = true, features = ["bundled-fonts"] }

[dev-dependencies]
nsh-engine.workspace = true
nsh-testing.workspace = true
