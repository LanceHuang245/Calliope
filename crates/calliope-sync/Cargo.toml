[package]
name = "calliope-sync"
description = "Calliope's sync: a vault mirrored to remote storage (WebDAV, S3), with change detection and conflict handling. No UI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["webdav", "s3"]
# A WebDAV server (Nextcloud, Synology, Jianguoyun, ...).
webdav = []
# S3 and S3-compatible storage (AWS, Cloudflare R2, MinIO, ...).
s3 = []

[dependencies]
calliope-core.workspace = true
log.workspace = true
thiserror.workspace = true
