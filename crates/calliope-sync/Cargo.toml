[package]
name = "calliope-sync"
description = "Calliope's sync: a vault mirrored to remote storage (WebDAV, S3), with change detection and conflict handling. No UI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
crypto_secretbox = "0.1.1"
data-encoding = "2"
getrandom = "0.3"
scrypt = "0.11"
zeroize = "1"
calliope-core.workspace = true
jiff.workspace = true
log.workspace = true
opendal.workspace = true
opendal-http-transport-reqwest.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-platform-verifier.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots.workspace = true

[dev-dependencies]
opendal = { workspace = true, features = ["services-fs"] }
tokio = { workspace = true, features = ["macros", "rt"] }
