name: CI

on:
  push:
  pull_request:

env:
  # The nightly CLI; Cargo.toml takes nsh's crates from its commit.
  NSH_VERSION: nightly

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: GTK 4 and GStreamer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            name: linux
            os: ubuntu-24.04
            artifact: dist/Calliope.tar.gz
          - target: windows
            name: windows
            os: windows-latest
            artifact: dist/Calliope.zip
          - target: macos
            name: macos
            os: macos-latest
            artifact: dist/Calliope-macos.zip
          # Android: an APK per ABI (64-bit and 32-bit ARM phones) and a
          # universal one, x86_64 included for emulators.
          - target: android
            name: android-arm64-v8a
            abis: arm64-v8a
            os: ubuntu-24.04
            artifact: dist/Calliope-arm64-v8a.apk
          - target: android
            name: android-armeabi-v7a
            abis: armeabi-v7a
            os: ubuntu-24.04
            artifact: dist/Calliope-armeabi-v7a.apk
          - target: android
            name: android-universal
            abis: arm64-v8a,armeabi-v7a,x86_64
            os: ubuntu-24.04
            artifact: dist/Calliope-universal.apk
          - target: ios
            name: ios
            os: macos-latest
            artifact: dist/Calliope.ipa
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: nsh (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: nsh (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" >> $env:GITHUB_PATH

      - name: GTK 4 and GStreamer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev clang
      - name: Android SDK and NDK
        if: matrix.target == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Android release key
        if: matrix.target == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING=--keystore $RUNNER_TEMP/release.jks --key-alias calliope" >> "$GITHUB_ENV"
          fi

      - run: nsh package app --target ${{ matrix.target }} ${{ matrix.abis && format('--abi {0}', matrix.abis) || '' }} ${{ env.SIGNING }} -o dist
        env:
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Name the APK by its ABIs
        if: matrix.target == 'android'
        run: mv dist/Calliope.apk ${{ matrix.artifact }}

      - name: Zip the macOS app
        if: matrix.target == 'macos'
        run: ditto -c -k --keepParent dist/Calliope.app dist/Calliope-macos.zip
      - name: Make the IPA
        if: matrix.target == 'ios'
        run: |
          mkdir dist/Payload
          mv dist/Calliope.app dist/Payload/
          cd dist && zip -qry Calliope.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: Calliope-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
