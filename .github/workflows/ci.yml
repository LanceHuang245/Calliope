name: CI

on:
  push:
  pull_request:

env:
  # The nightly CLI; Cargo.toml takes nsh's crates from its commit.
  NSH_VERSION: nightly

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: GTK 4
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-24.04
            artifact: dist/Calliope.tar.gz
          - target: windows
            os: windows-latest
            artifact: dist/Calliope.zip
          - target: macos
            os: macos-latest
            artifact: dist/Calliope-macos.zip
          - target: android
            os: ubuntu-24.04
            artifact: dist/Calliope.apk
          - target: ios
            os: macos-latest
            artifact: dist/Calliope.ipa
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: nsh (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: nsh (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" >> $env:GITHUB_PATH

      - name: GTK 4
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev clang
      - name: Android SDK and NDK
        if: matrix.target == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: nsh package app --target ${{ matrix.target }} -o dist

      - name: Zip the macOS app
        if: matrix.target == 'macos'
        run: ditto -c -k --keepParent dist/Calliope.app dist/Calliope-macos.zip
      - name: Make the IPA
        if: matrix.target == 'ios'
        run: |
          mkdir dist/Payload
          mv dist/Calliope.app dist/Payload/
          cd dist && zip -qry Calliope.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: Calliope-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
