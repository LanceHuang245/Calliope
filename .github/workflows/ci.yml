name: CI

on:
  push:
  pull_request:

env:
  # The nightly CLI; Cargo.toml takes nsh's crates from its commit.
  NSH_VERSION: nightly

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: GTK 4 and GStreamer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The sync tests again on a real WebDAV server and a real S3 one, in
  # Docker (`crates/calliope-sync/src/tests.rs`). VersityGW stands in for
  # MinIO, which no longer publishes its images.
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: WebDAV and S3 servers
        run: |
          printf 'address: 0.0.0.0\nport: 6065\ndirectory: /data\npermissions: CRUD\nusers:\n  - username: calliope\n    password: calliope-secret\n' > "$RUNNER_TEMP/webdav.yml"
          docker run -d -p 6065:6065 -v "$RUNNER_TEMP/webdav.yml:/config.yml" ghcr.io/hacdias/webdav:latest -c /config.yml
          docker run -d -p 7070:7070 -e ROOT_ACCESS_KEY=calliope -e ROOT_SECRET_KEY=calliope-secret ghcr.io/versity/versitygw:latest posix /tmp
          sleep 5
          curl -fsS --aws-sigv4 "aws:amz:us-east-1:s3" --user calliope:calliope-secret -X PUT http://127.0.0.1:7070/calliope
      - run: cargo test -p calliope-sync
        env:
          CALLIOPE_TEST_WEBDAV: http://127.0.0.1:6065 calliope calliope-secret
          CALLIOPE_TEST_S3: http://127.0.0.1:7070 calliope calliope calliope-secret

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            name: linux
            os: ubuntu-24.04
            artifact: dist/Calliope.tar.gz
          - target: windows
            name: windows
            os: windows-latest
            artifact: dist/Calliope.zip
          - target: macos
            name: macos
            os: macos-latest
            artifact: dist/Calliope-macos.zip
          # Android: an APK per ABI (64-bit and 32-bit ARM phones) and a
          # universal one, x86_64 included for emulators, in one artifact.
          - target: android
            name: android
            os: ubuntu-24.04
            artifact: dist/Calliope-*.apk
          - target: ios
            name: ios
            os: macos-latest
            artifact: dist/Calliope.ipa
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: nsh (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: nsh (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" >> $env:GITHUB_PATH

      # nsh's Linux runners (built for Android too) default to web views:
      # WebKitGTK 6.0, as nsh's own release build installs it.
      - name: GTK 4, GStreamer and WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwebkitgtk-6.0-dev clang
      - name: Android SDK and NDK
        if: matrix.target == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Android release key
        if: matrix.target == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING=--keystore $RUNNER_TEMP/release.jks --key-alias calliope" >> "$GITHUB_ENV"
          fi

      - run: nsh package app --target ${{ matrix.target }} -o dist
        if: matrix.target != 'android'
      - name: APKs by ABI, and a universal one
        if: matrix.target == 'android'
        env:
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          for abis in arm64-v8a armeabi-v7a arm64-v8a,armeabi-v7a,x86_64; do
            nsh package app --target android --abi "$abis" $SIGNING -o dist
            case "$abis" in *,*) name=universal ;; *) name=$abis ;; esac
            mv dist/Calliope.apk "dist/Calliope-$name.apk"
          done

      - name: Zip the macOS app
        if: matrix.target == 'macos'
        run: ditto -c -k --keepParent dist/Calliope.app dist/Calliope-macos.zip
      - name: Make the IPA
        if: matrix.target == 'ios'
        run: |
          mkdir dist/Payload
          mv dist/Calliope.app dist/Payload/
          cd dist && zip -qry Calliope.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: Calliope-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
