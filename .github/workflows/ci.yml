name: CI

on:
  push:
  pull_request:

env:
  # The nightly CLI; Cargo.toml takes nsh's crates from its commit.
  NSH_VERSION: nightly

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            name: linux
            os: ubuntu-24.04
            artifact: dist/Calliope.tar.gz
          - target: windows
            name: windows
            os: windows-latest
            artifact: dist/Calliope.zip
          - target: macos
            name: macos
            os: macos-latest
            artifact: dist/Calliope-macos.zip
          # One APK for 64-bit and 32-bit ARM phones and x86_64 emulators.
          - target: android
            name: android
            os: ubuntu-24.04
            artifact: dist/Calliope-universal.apk
          - target: ios
            name: ios
            os: macos-latest
            artifact: dist/Calliope.ipa
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: nsh (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: nsh (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" >> $env:GITHUB_PATH

      # nsh's Linux runners (built for Android too) default to web views:
      # WebKitGTK 6.0, as nsh's own release build installs it.
      - name: GTK 4, GStreamer and WebKitGTK
        if: runner.os == 'Linux'
        run: |
          # Ubuntu's own archive, not the runner's Azure mirror, which fails
          # or crawls now and then: the runner's apt reads its mirrors from
          # apt-mirrors.txt (actions/runner-images, configure-apt-sources.sh).
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwebkitgtk-6.0-dev clang
      - name: Android SDK and NDK
        if: matrix.target == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Android release key
        if: matrix.target == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            if [ -z "$PASSWORD" ]; then
              echo "ANDROID_KEYSTORE_PASSWORD is required when ANDROID_KEYSTORE_BASE64 is set" >&2
              exit 1
            fi
            printf '%s' "$KEYSTORE" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            keytool -list -keystore "$RUNNER_TEMP/release.jks" -alias calliope -storepass "$PASSWORD" >/dev/null
            echo "SIGNING=--keystore $RUNNER_TEMP/release.jks --key-alias calliope" >> "$GITHUB_ENV"
          fi

      - run: nsh package app --target ${{ matrix.target }} -o dist
        if: matrix.target != 'android'
      - name: Universal Android APK
        if: matrix.target == 'android'
        env:
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          nsh package app --target android --abi arm64-v8a,armeabi-v7a,x86_64 $SIGNING -o dist
          mv dist/Calliope.apk dist/Calliope-universal.apk

      - name: Zip the macOS app
        if: matrix.target == 'macos'
        run: ditto -c -k --keepParent dist/Calliope.app dist/Calliope-macos.zip
      - name: Make the IPA
        if: matrix.target == 'ios'
        run: |
          mkdir dist/Payload
          mv dist/Calliope.app dist/Payload/
          cd dist && zip -qry Calliope.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: Calliope-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
